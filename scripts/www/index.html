    <script>
      // 暴力禁用 Service Worker，防止本地环境报错
      if ('serviceWorker' in navigator) {
        Object.defineProperty(navigator, 'serviceWorker', {
          value: {
            register: () => Promise.resolve(),
            ready: new Promise(() => {}),
            addEventListener: () => {},
            removeEventListener: () => {}
          },
          writable: false
        });
      }
    </script>
    <meta charset="UTF-8" />

    <script>
      (function() {
        // 过滤 Vite HMR WebSocket 报错
        var origConsoleError = console.error;
        console.error = function() {
          var msg = arguments && arguments[0];
          if (typeof msg === 'string' && (
            msg.indexOf('WebSocket closed without opened') !== -1 ||
            msg.indexOf('[vite] failed to connect to websocket') !== -1
          )) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };

        window.addEventListener('error', function(e) {
          if (e && e.message && e.message.indexOf('WebSocket closed without opened') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && e.reason;
          var msg = (typeof reason === 'string') ? reason : (reason && reason.message);
          if (typeof msg === 'string' && msg.indexOf('WebSocket closed without opened') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);

        if (typeof window !== 'undefined' && window.WebSocket) {
          var OriginalWS = window.WebSocket;
          var ViteDummyWS = function(url, protocols) {
            var isViteProtocol = (typeof protocols === 'string' && (protocols === 'vite-hmr' || protocols === 'vite-ping')) ||
                                 (Array.isArray(protocols) && (protocols.includes('vite-hmr') || protocols.includes('vite-ping')));
            if (isViteProtocol) {
              var target = new EventTarget();
              target.binaryType = 'blob';
              target.bufferedAmount = 0;
              target.extensions = '';
              target.protocol = typeof protocols === 'string' ? protocols : 'vite-hmr';
              target.readyState = 1;
              target.url = url || '';
              target.close = function() {};
              target.send = function() {};
              setTimeout(function() {
                if (typeof target.onopen === 'function') {
                  try { target.onopen(new Event('open')); } catch (_) {}
                }
                target.dispatchEvent(new Event('open'));
              }, 10);
              return target;
            }
            return new OriginalWS(url, protocols);
          };
          ViteDummyWS.prototype = OriginalWS.prototype;
          ViteDummyWS.CONNECTING = OriginalWS.CONNECTING;
          ViteDummyWS.OPEN = OriginalWS.OPEN;
          ViteDummyWS.CLOSING = OriginalWS.CLOSING;
          ViteDummyWS.CLOSED = OriginalWS.CLOSED;
          window.WebSocket = ViteDummyWS;
        }
      })();
    </script>

    <!-- 终极补丁：隐藏多余模块 + 智能拦截数据（小文件复制，大文件开启救援页面） -->
    <script>
      (function() {
        // ================= 1. 隐藏不想要的界面 =================
        const textsToRemove = ['私密衣橱', '共读时光', '语音消息', 'Speech 2.8 Turbo'];
        function hideUnwantedElements() {
          const allElements = document.querySelectorAll('*');
          allElements.forEach(el => {
            const elText = el.textContent.trim();
            if (textsToRemove.some(t => elText === t) && el.children.length === 0) {
              let parent = el.closest('button, .flex, [role="button"]') || el.parentElement;
              if (parent) parent.style.display = 'none';
            }
            if (elText.includes('语音消息') && elText.includes('Speech')) {
              let card = el.closest('.rounded-xl, .bg-white, div[class*="card"]');
              if (card) card.style.display = 'none';
            }
          });
        }
        const observer = new MutationObserver(hideUnwantedElements);
        window.addEventListener('DOMContentLoaded', () => {
          hideUnwantedElements();
          observer.observe(document.body, { childList: true, subtree: true });
        });

        // ================= 2. 智能拦截数据导出 =================
        const originalClick = HTMLAnchorElement.prototype.click;
        HTMLAnchorElement.prototype.click = function() {
          // 拦截 .json 文件的导出
          if (this.download && this.download.endsWith('.json') && this.href.startsWith('blob:')) {
            const fileName = this.download;
            fetch(this.href)
              .then(res => res.text())
              .then(text => {
                // 【日常模式】小于 2MB：直接塞进剪贴板，极速搞定
                if (text.length <= 2000000) {
                  const textarea = document.createElement('textarea');
                  textarea.value = text;
                  textarea.style.position = 'fixed';
                  textarea.style.opacity = '0';
                  document.body.appendChild(textarea);
                  textarea.select();
                  try {
                    document.execCommand('copy');
                    alert(`COPY成功✨ (已复制: ${fileName})`); 
                  } catch (err) {
                    alert('复制失败了，请重试✨');
                  }
                  document.body.removeChild(textarea);
                } 
                // 【救援模式】大于 2MB：生成救援页面，再也不怕剪贴板爆炸
                else {
                  alert(`⚠️ 备份文件较大（约 ${(text.length/1024/1024).toFixed(1)}MB），剪贴板装不下。\n\n即将为您生成“救援页面”，请长按文本框全选复制，或点击保存。`);
                  
                  const htmlContent = `
                    <html>
                    <head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>数据救援 - ${fileName}</title></head>
                    <body style="padding: 15px; background: #1a1a1a; color: #fff; font-family: sans-serif;">
                      <h3 style="color: #4ade80;">✨ 数据已成功提取</h3>
                      <p style="font-size: 14px; color: #ccc;">方法1：长按下方文本框 -> 全选 -> 复制，然后粘贴到备忘录。</p>
                      <p style="font-size: 14px; color: #ccc;">方法2：点击下面的链接尝试保存文件。</p>
                      
                      <a href="data:application/json;charset=utf-8,${encodeURIComponent(text)}" download="${fileName}" 
                         style="display: inline-block; padding: 10px 20px; background: #4ade80; color: #000; text-decoration: none; border-radius: 5px; font-weight: bold; margin-bottom: 15px;">
                         点我尝试保存文件
                      </a>
                      
                      <textarea style="width: 100%; height: 60vh; background: #000; color: #0f0; border: 1px solid #333; padding: 10px; font-family: monospace; font-size: 12px;" readonly>${text}</textarea>
                    </body>
                    </html>
                  `;

                  const blob = new Blob([htmlContent], { type: 'text/html' });
                  const url = URL.createObjectURL(blob);
                  window.open(url, '_blank');
                }
              })
              .catch(err => alert('读取数据失败：' + err));
              
            return; // 阻止原版下载
          }
          
          // 如果不是 .json，放行原版下载逻辑
          originalClick.apply(this, arguments);
        };
      })();
    </script>
  </body>
